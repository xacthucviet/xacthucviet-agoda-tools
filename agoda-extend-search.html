<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <!-- ✅ Viewport tối ưu chống zoom iOS -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Agoda Search Widget</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: transparent;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      transform-origin: 0 0;
      zoom: 1 !important;
    }

    /* Căn giữa widget */
    .widget-wrapper {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: auto;
      overflow: visible;
      position: relative;
      z-index: 9999;
    }

    /* ✅ Ngăn iOS zoom khi focus input */
    input, select, textarea, button {
      font-size: 16px !important;
      -webkit-appearance: none;
    }
  </style>
</head>

<body>
  <div class="widget-wrapper">
    <div id="adgshp1134854488"></div>
  </div>

  <!-- Agoda widget script -->
  <script
    type="text/javascript"
    src="//cdn0.agoda.net/images/sherpa/js/sherpa_init1_08.min.js"
  ></script>

  <script type="text/javascript">
    var stg = new Object();
    stg.crt = "9963919083159";
    stg.version = "1.04";
    stg.id = stg.name = "adgshp1134854488";
    stg.width = "300px";
    stg.height = "250px";
    stg.ReferenceKey = "esMvFFB9Yqj7ourN0hnRjg==";
    stg.Layout = "Square";
    stg.Language = "vi-vn";
    stg.Cid = "1950843";
    stg.City = "16264";
    stg.DestinationName = "Phan Thiết, Việt Nam";
    stg.OverideConf = false;
    new AgdSherpa(stg).initialize();
  </script>

  <!-- ✅ JS phụ trợ đảm bảo không zoom khi focus -->
  <script>
    window.addEventListener('load', () => {
      document.querySelectorAll('input, select, textarea, button').forEach(el => {
        el.addEventListener('focus', () => {
          document.body.style.zoom = "1";
          document.documentElement.style.zoom = "1";
        });
      });
    });
  </script>
</body>
</html>
